global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "api_sentinel_web"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          app: "web"

  - job_name: "api_sentinel_worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          app: "worker"
